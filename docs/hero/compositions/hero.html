  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = (sel) => document.querySelectorAll(sel);

      // Top bar. The background stays still from frame 0, so the GIF loop (last frame -> first) has no jump.
      tl.fromTo(
        "#hero-bar",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        0.15,
      );

      // Title: eyebrow whole-line blur, then per-word blur-in
      tl.fromTo(
        "#hero-eyebrow",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" },
        0.45,
      );
      S("#hero-title .w").forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" },
          0.65 + i * 0.067,
        );
      });

      // Title steps aside to become the header: one move, eased both ways
      tl.fromTo("#hero-title", { y: 0, scale: 1 }, { y: -150, scale: 0.52, duration: 0.6, ease: "power2.inOut" }, 2.9);
      // The eyebrow would shrink below a readable size with the title; it leaves instead.
      tl.to("#hero-eyebrow", { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, 2.9);

      // Sources arrive from the left, staggered
      ["#hero-src-web", "#hero-src-api", "#hero-src-lake"].forEach((id, i) => {
        tl.fromTo(
          id,
          { opacity: 0, x: -48, filter: "blur(8px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
          3.4 + i * 0.08,
        );
      });

      // Wires draw, then a packet runs each one into the JSON
      const wireStyle = { fill: "none", stroke: "url(#hero-wire-grad)", strokeWidth: 3, strokeLinecap: "round" };
      S("#hero-wires .wire").forEach((p) => {
        const len = p.getTotalLength() || 260;
        Object.assign(p.style, {
          fill: wireStyle.fill,
          stroke: wireStyle.stroke,
          strokeWidth: wireStyle.strokeWidth,
          strokeLinecap: wireStyle.strokeLinecap,
          strokeDasharray: len + " " + (len + 20),
        });
        p.dataset.len = len;
      });
      ["#hero-w1", "#hero-w2", "#hero-w3"].forEach((id, i) => {
        const len = +document.querySelector(id).dataset.len;
        // +10: start inside the gap, so the round cap leaves no dot before the draw.
        tl.fromTo(
          id,
          { strokeDashoffset: len + 10 },
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" },
          3.7 + i * 0.12,
        );
      });
      ["#hero-p1", "#hero-p2", "#hero-p3"].forEach((id, i) => {
        const p = document.querySelector(id);
        const len = p.getTotalLength() || 260;
        Object.assign(p.style, {
          fill: "none",
          stroke: "#38bdf8",
          strokeWidth: 5,
          strokeLinecap: "round",
          strokeDasharray: "36 " + (len + 60),
        });
        tl.fromTo(
          p,
          { strokeDashoffset: 46, opacity: 1 },
          { strokeDashoffset: -len, duration: 0.7, ease: "power1.inOut" },
          4.1 + i * 0.12,
        );
        tl.to(p, { opacity: 0, duration: 0.1 }, 4.8 + i * 0.12);
      });

      // The JSON arrives where the packets land, then its lines reveal
      tl.fromTo(
        "#hero-json",
        { opacity: 0, scale: 0.97, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },
        4.25,
      );
      S("#hero-json .line").forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, filter: "blur(4px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" },
          4.7 + i * 0.05,
        );
      });

      // Wires to the right column
      ["#hero-w4", "#hero-w5"].forEach((id, i) => {
        const len = +document.querySelector(id).dataset.len;
        document.querySelector(id).style.stroke = "#1e6fd9";
        tl.fromTo(
          id,
          { strokeDashoffset: len + 10 },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          5.3 + i * 1.75,
        );
      });

      // Net of the day counts up, then holds
      tl.fromTo(
        "#hero-net",
        { opacity: 0, x: 32, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
        5.4,
      );
      const net = { v: 0 };
      const netEl = document.getElementById("hero-net-value");
      const fmt = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      tl.fromTo(
        net,
        { v: 0 },
        {
          v: 9142.38,
          duration: 1.4,
          ease: "power2.out",
          onUpdate: () => {
            netEl.textContent = "$" + fmt.format(net.v);
          },
        },
        5.55,
      );
      tl.fromTo("#hero-net-note", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 6.95);

      // Diff: bars fill to the share of equal accounts
      tl.fromTo(
        "#hero-diff",
        { opacity: 0, x: 32, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
        7.15,
      );
      tl.fromTo(
        "#hero-api-fill",
        { scaleX: 0 },
        { scaleX: 1, transformOrigin: "0 50%", duration: 0.8, ease: "power3.out" },
        7.45,
      );
      tl.fromTo(
        "#hero-lake-diff",
        { scaleX: 0 },
        { scaleX: 1, transformOrigin: "0 50%", duration: 0.8, ease: "power3.out" },
        7.6,
      );
      tl.fromTo(
        "#hero-lake-fill",
        { scaleX: 0 },
        { scaleX: 1, transformOrigin: "0 50%", duration: 0.8, ease: "power3.out" },
        7.6,
      );
      tl.fromTo(
        ["#hero-api-count", "#hero-lake-count"],
        { opacity: 0 },
        { opacity: 1, duration: 0.2, stagger: 0.1 },
        8.2,
      );

      // Closing line, long hold, then everything clears to the ground for a clean loop
      tl.fromTo(
        "#hero-tagline",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        8.2,
      );
      tl.to(
        ["#hero-bar", "#hero-title", "#hero-wires", ".source", "#hero-json", ".panel", "#hero-tagline"],
        { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" },
        11.55,
      );

      window.__timelines["hero"] = tl;
    })();
  </script>
