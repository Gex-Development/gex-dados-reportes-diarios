<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="dia-title dia-desc">
  <title id="dia-title">O dia D tem relógios e eventos diferentes</title>
  <desc id="dia-desc">BuyGoods usa o dia GMT-4; PagAmerican usa UTC. No PagAmerican, checkout aberto às 23:53 em D e venda às 00:02 em D+1 pertence a D no painel e API, mas a D+1 no lake.</desc>
  <defs><linearGradient id="dia-bg" x2="1" y2="1"><stop stop-color="#07204a"/><stop offset=".5" stop-color="#030a1a"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
  <style>
    text{font-family:Geist,Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f4f4f5}
    .mono,.eyebrow{font-family:ui-monospace,'SF Mono',Menlo,monospace}.eyebrow{letter-spacing:.1em;fill:#7fc3ef;font-size:12px}.title{font-size:30px;font-weight:500;letter-spacing:-.03em}.label{font-size:19px;font-weight:600}.small{font-size:14px}.muted{fill:#a1a1aa}
    .reveal{opacity:0;animation:dia-in .55s ease forwards}.r2{animation-delay:.5s}.r3{animation-delay:1.1s}
    .sweep{animation:dia-sweep 3.4s ease-in-out 1 forwards}.landing{opacity:0;animation:dia-land .45s ease-out 3.2s forwards}.landing.later{animation-delay:3.7s}
    @keyframes dia-in{to{opacity:1}}@keyframes dia-sweep{from{transform:translateX(0)}to{transform:translateX(718px)}}@keyframes dia-land{to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.reveal,.landing{opacity:1;animation:none}.sweep{animation:none;transform:translateX(718px)}}
  </style>
  <rect x="1" y="1" width="1198" height="533" rx="22" fill="url(#dia-bg)" stroke="#26272d" stroke-width="2"/>
  <text class="eyebrow" x="42" y="43">• CORTE TEMPORAL</text><text class="title" x="42" y="83">Qual dia é D?</text>
  <text class="small muted" x="42" y="112">A data padrão é o último dia completo no relógio de cada gateway, não no computador.</text>
  <g class="reveal">
    <text class="eyebrow" x="220" y="160">00:00</text><text class="eyebrow" x="570" y="160">12:00</text><text class="eyebrow" x="916" y="160">24:00</text>
    <text class="eyebrow" x="1040" y="160">D+1</text>
    <path d="M220 179H1120" stroke="#526579" stroke-width="2"/><path d="M220 172V186M580 172V186M940 165V188M1120 172V186" stroke="#526579" stroke-width="2"/>
    <text class="label" x="42" y="223">BuyGoods</text><text class="small muted" x="42" y="246">GMT-4</text>
    <rect x="220" y="200" width="720" height="52" rx="10" fill="#14202e" stroke="#1e6fd9"/><text class="label" x="565" y="233" text-anchor="middle">Dia D · Ledger e Painel</text>
    <text class="label" x="42" y="301">PagAmerican</text><text class="small muted" x="42" y="324">UTC</text>
    <rect x="220" y="278" width="720" height="52" rx="10" fill="#14202e" stroke="#38bdf8"/><text class="label" x="565" y="311" text-anchor="middle">Dia D · UTC</text>
    <rect x="944" y="278" width="176" height="52" rx="10" fill="#18191d" stroke="#26272d"/><text class="small muted" x="1030" y="310" text-anchor="middle">Dia D+1</text>
    <path d="M940 175V334" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g class="reveal r2">
    <text class="eyebrow" x="42" y="376">• PEDIDO NA VIRADA · PAGAMERICAN UTC</text>
    <text class="small muted" x="42" y="401">Trecho perto de 00:00 ampliado: as marcas não representam intervalo proporcional.</text>
    <rect x="42" y="419" width="1116" height="90" rx="16" fill="#131417" stroke="#26272d"/>
    <text class="small muted" x="65" y="447">Painel / API</text><text class="small muted" x="65" y="485">Lake</text>
    <path d="M346 443H1110M346 481H1110" stroke="#526579" stroke-width="2"/>
    <path d="M940 428V497" stroke="#fcd34d" stroke-dasharray="5 5"/>
    <text class="eyebrow" x="906" y="415">D</text><text class="eyebrow" x="961" y="415">D+1</text>
    <text class="small muted" x="731" y="467">Checkout 23:53</text><text class="small muted" x="971" y="467">Venda 00:02</text>
  </g>
  <g class="reveal r3"><circle class="sweep" cx="220" cy="304" r="7" fill="#38bdf8" aria-hidden="true"/></g>
  <g class="landing"><circle cx="925" cy="443" r="7" fill="#34d399"/><text class="small" x="515" y="447">D (checkout)</text></g>
  <g class="landing later"><circle cx="966" cy="481" r="7" fill="#fb923c"/><text class="small" x="515" y="486">D+1 (venda)</text></g>
</svg>
